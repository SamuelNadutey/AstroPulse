{# Small inline severity icon, color via CSS `currentColor` (bundled only).
   Icon + text + color are always shown together, never color alone. #}
{% if shape == "circle-empty" %}
<svg width="14" height="14" viewBox="0 0 14 14" role="img" aria-hidden="true" focusable="false"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
{% elif shape == "circle" %}
<svg width="14" height="14" viewBox="0 0 14 14" role="img" aria-hidden="true" focusable="false"><circle cx="7" cy="7" r="6" fill="currentColor"/></svg>
{% elif shape == "triangle" %}
<svg width="14" height="14" viewBox="0 0 14 14" role="img" aria-hidden="true" focusable="false"><path d="M7 1 L13 13 L1 13 Z" fill="currentColor"/></svg>
{% elif shape == "diamond" %}
<svg width="14" height="14" viewBox="0 0 14 14" role="img" aria-hidden="true" focusable="false"><path d="M7 0 L14 7 L7 14 L0 7 Z" fill="currentColor"/></svg>
{% else %}
<svg width="14" height="14" viewBox="0 0 14 14" role="img" aria-hidden="true" focusable="false"><polygon points="4.2,0 9.8,0 14,4.2 14,9.8 9.8,14 4.2,14 0,9.8 0,4.2" fill="currentColor"/></svg>
{% endif %}
